# BoleHunter 伯乐猎 —— Docker Compose 一键部署（迭代16；迭代25 免构建默认化）
# 快速开始：bash deploy.sh   （自动生成 .env + 拉镜像 + 起服务 + 健康检查）
# 手动等价：cp .env.example .env && docker compose up -d
# 本地构建镜像（不走 GHCR）：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# 访问：http://localhost:8080   默认账号 root / 123456（首次登录请立即修改）

services:
  mysql:
    image: mysql:8.4
    container_name: bolehunter-mysql
    # 业务时间统一东八区；utf8mb4 支持表情与生僻字
    command: >
      --default-time-zone=+08:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-bolehunter2026}
      MYSQL_DATABASE: bolehunter
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动初始化：字母序执行 = 基线 + 迭代迁移的正确顺序
      - ./bolehunter-ats/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-bolehunter2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bolehunter-redis
    # 登录限流/验证码等轻量使用，AOF 每 60 秒落盘足够
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 默认直接使用 GHCR 公开镜像（迭代18 起 CI 自动发布），服务器无需任何构建环境；
  # 本地没有该镜像时 up 会自动拉取。要源码构建见 docker-compose.build.yml
  backend:
    image: ghcr.io/zhuangrenyang/bolehunter-backend:latest
    container_name: bolehunter-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-bolehunter2026}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-random-64-char-secret-in-production-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      REDIS_HOST: redis
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 数据库未初始化完成时允许重启等待
    restart: unless-stopped

  frontend:
    image: ghcr.io/zhuangrenyang/bolehunter-frontend:latest
    container_name: bolehunter-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
