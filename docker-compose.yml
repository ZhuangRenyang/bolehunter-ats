# BoleHunter 伯乐猎 —— Docker Compose 一键部署（迭代16；迭代25 免构建默认化）
# 快速开始：bash deploy.sh   （自动生成 .env + 拉镜像 + 起服务 + 健康检查）
# 手动等价：cp .env.example .env && docker compose up -d
# 本地构建镜像（不走 GHCR）：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# 访问：http://localhost:8080   默认账号 root / 123456（首次登录请立即修改）

services:
  mysql:
    # 镜像源参数化（迭代28 国内一键部署）：默认 Docker Hub，deploy-cn.sh 生成的 .env 会
    # 写入 MYSQL_IMAGE 等四个变量指向阿里云 ACR，国内服务器全部镜像从单一国内源拉取
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: bolehunter-mysql
    # 业务时间统一东八区；utf8mb4 支持表情与生僻字
    command: >
      --default-time-zone=+08:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-bolehunter2026}
      MYSQL_DATABASE: bolehunter
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动初始化：字母序执行 = 基线 + 迭代迁移的正确顺序
      - ./bolehunter-ats/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-bolehunter2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: bolehunter-redis
    # 登录限流/验证码等轻量使用，AOF 每 60 秒落盘足够
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 默认直接使用 GHCR 公开镜像（迭代18 起 CI 自动发布），服务器无需任何构建环境；
  # 本地没有该镜像时 up 会自动拉取。要源码构建见 docker-compose.build.yml
  # 国内部署：deploy-cn.sh 生成的 .env 将 BACKEND_IMAGE/FRONTEND_IMAGE 指向阿里云 ACR
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/zhuangrenyang/bolehunter-backend:latest}
    container_name: bolehunter-backend
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-bolehunter2026}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-random-64-char-secret-in-production-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      REDIS_HOST: redis
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      # 迭代26 后台一键升级三件套：迁移脚本目录 / compose 目录 / 升级开关
      MIGRATION_DIR: /app/sql
      UPGRADE_COMPOSE_DIR: /app/deploy
      UPGRADE_ENABLED: ${UPGRADE_ENABLED:-true}
    volumes:
      # 增量迁移脚本：新版本 backend 启动时自动补齐新表/新字段
      - ./bolehunter-ats/sql:/app/sql:ro
      # 自升级（迭代26）：compose 编排文件与 .env（容器内经 docker.sock 控制宿主机 compose）
      - ./docker-compose.yml:/app/deploy/docker-compose.yml:ro
      - ./docker-compose.build.yml:/app/deploy/docker-compose.build.yml:ro
      - ./.env:/app/deploy/.env:ro
      # docker 控制通道。安全边界：等价宿主机 root，入口仅管理员且有审计；不需要此功能可删除本行并设 UPGRADE_ENABLED=false
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 数据库未初始化完成时允许重启等待
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/zhuangrenyang/bolehunter-frontend:latest}
    container_name: bolehunter-frontend
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 升级代理（迭代 29）：后台一键升级只做 compose pull + 写标记文件，容器滚动重建
  # 由本服务执行——up -d 在独立容器内运行，不存在"backend 升级自己时进程被杀"的问题。
  # 标记文件 .upgrade-requested 由 SelfUpgradeService 写入（挂载的 compose 目录内）
  upgrader:
    image: ${UPGRADER_IMAGE:-docker:27-cli}
    container_name: bolehunter-upgrader
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy
    working_dir: /deploy
    command: sh -c 'while true; do if [ -f /deploy/.upgrade-requested ]; then echo "[upgrader] 检测到升级请求，执行滚动更新"; docker compose pull && docker compose up -d --remove-orphans && rm -f /deploy/.upgrade-requested && echo "[upgrader] 升级完成"; fi; sleep 30; done'
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
