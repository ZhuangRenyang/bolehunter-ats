# BoleHunter 前端 Nginx 配置：SPA history 路由 + 后端反代（同源部署，无跨域）
server {
    listen 80;
    server_name _;

    # 简历上传上限（与后端 spring.servlet.multipart 配置一致）
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # WebSocket 实时消息（迭代23）。
    # 必须单独匹配：Upgrade 头只有在 HTTP/1.1 下才成立，且长连接需远超普通接口的读超时，
    # 否则空闲会话会在 proxy_read_timeout 后被 nginx 静默掐断。
    # 路径比下面的 /recruit/ 更长，nginx 按最长前缀优先匹配，故置于其后也不影响。
    location /recruit/ws {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端 API（全部 /recruit/** 走后端）
    location /recruit/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 简历/头像等上传文件（后端本地文件服务，服务整个 /assets/**）
    # 注意：Vite 产物已通过 assetsDir:'static' 输出到 /static/（迭代28），不再与此路径冲突
    location /assets/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # 带 hash 的构建产物永久缓存（迭代 37：文件名即版本，内容变更必然换文件名）
    location /static/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML 不缓存（迭代 37）：发版后普通刷新即可拉到新 JS 引用，
    # 否则浏览器缓存旧 index.html 会继续加载旧版本 JS（用户实测踩坑）
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA history 路由兜底
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
