# BoleHunter 伯乐猎 —— CI
# push / PR 触发：版权头合规检查 → 后端 mvn test（JDK 17）→ 前端构建（Node 22）→ Docker 镜像构建验证
# main 分支 push 额外自动发布镜像到 GHCR（ghcr.io/zhuangrenyang/*），无需任何手工步骤

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  license:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查版权头
        run: python scripts/check_license.py .

  backend:
    name: Backend Compile (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译并测试后端
        working-directory: bolehunter-ats
        run: mvn -B test

  frontend:
    name: Frontend Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bolehunter-ats-web/package-lock.json
      - name: 安装依赖
        run: cd bolehunter-ats-web && npm ci --no-audit --no-fund
      - name: 构建前端
        run: cd bolehunter-ats-web && npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -t bolehunter-backend ./bolehunter-ats
      - name: 构建前端镜像
        run: docker build -t bolehunter-frontend ./bolehunter-ats-web
      - name: 校验 compose 配置
        run: docker compose -f docker-compose.yml config -q

  publish:
    name: Publish to GHCR
    # 仅 main 分支 push 时发布镜像（PR 不发布）
    if: github.event_name == 'push'
    needs: [license, backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./bolehunter-ats
          push: true
          tags: |
            ghcr.io/zhuangrenyang/bolehunter-backend:latest
            ghcr.io/zhuangrenyang/bolehunter-backend:${{ github.sha }}
      - name: 推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./bolehunter-ats-web
          push: true
          tags: |
            ghcr.io/zhuangrenyang/bolehunter-frontend:latest
            ghcr.io/zhuangrenyang/bolehunter-frontend:${{ github.sha }}

  publish-cn:
    name: Sync to Aliyun ACR (China)
    # 迭代28 国内一键部署：把业务镜像 + 官方 mysql/redis 同步一份到阿里云 ACR，
    # 供国内服务器 deploy-cn.sh 从单一国内源拉取（ghcr.io / Docker Hub 国内直连不可靠）。
    # 前置配置（仓库 Settings → Secrets and variables → Actions）：
    #   Variables: ACR_REGISTRY（如 crpi-xxx.cn-hangzhou.personal.cr.aliyuncs.com，非敏感）
    #   Secrets:   ACR_USERNAME / ACR_PASSWORD（ACR 固定密码）
    # 未配置 ACR_REGISTRY 时本 job 自动跳过，不影响其余 CI。
    if: github.event_name == 'push' && vars.ACR_REGISTRY != ''
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: 同步镜像到 ACR（业务镜像 + 基础镜像）
        env:
          REG: ${{ vars.ACR_REGISTRY }}
        run: |
          set -e
          NS=bolehunter
          sync() {
            echo ">> $1  →  $2"
            docker pull "$1"
            docker tag  "$1" "$2"
            docker push "$2"
            # 同步后回拉验证元数据完整（迭代28 实测：ACR 链路可能丢 WorkingDir 配置）
            docker pull "$2" > /dev/null
            echo "   验证 WorkingDir=[$(docker image inspect "$2" --format '{{.Config.WorkingDir}}')]"
          }
          sync ghcr.io/zhuangrenyang/bolehunter-backend:latest   "$REG/$NS/bolehunter-backend:latest"
          sync ghcr.io/zhuangrenyang/bolehunter-frontend:latest  "$REG/$NS/bolehunter-frontend:latest"
          sync mysql:8.4      "$REG/$NS/mysql:8.4"
          sync redis:7-alpine "$REG/$NS/redis:7-alpine"
          sync containrrr/watchtower:latest "$REG/$NS/watchtower:latest"
          # backend 关键文件存在性校验（防 jar 丢失的启动崩溃循环）
          if ! docker run --rm --entrypoint sh "$REG/$NS/bolehunter-backend:latest" -c 'test -f /app/app.jar'; then
            echo "::error::同步后的 backend 镜像缺少 /app/app.jar"
            exit 1
          fi
          echo "backend /app/app.jar 校验通过"
