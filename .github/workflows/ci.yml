# BoleHunter 伯乐猎 —— CI
# push / PR 触发：版权头合规检查 → 后端 mvn test（JDK 17）→ 前端构建（Node 22）→ Docker 镜像构建验证
# main 分支 push 额外自动发布镜像到 GHCR（ghcr.io/zhuangrenyang/*），无需任何手工步骤

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  license:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查版权头
        run: python scripts/check_license.py .

  backend:
    name: Backend Compile (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译并测试后端
        working-directory: bolehunter-ats
        run: mvn -B test

  frontend:
    name: Frontend Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bolehunter-ats-web/package-lock.json
      - name: 安装依赖
        run: cd bolehunter-ats-web && npm ci --no-audit --no-fund
      - name: 构建前端
        run: cd bolehunter-ats-web && npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -t bolehunter-backend ./bolehunter-ats
      - name: 构建前端镜像
        run: docker build -t bolehunter-frontend ./bolehunter-ats-web
      - name: 校验 compose 配置
        run: docker compose -f docker-compose.yml config -q

  publish:
    name: Publish to GHCR
    # 仅 main 分支 push 时发布镜像（PR 不发布）
    if: github.event_name == 'push'
    needs: [license, backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./bolehunter-ats
          push: true
          tags: |
            ghcr.io/zhuangrenyang/bolehunter-backend:latest
            ghcr.io/zhuangrenyang/bolehunter-backend:${{ github.sha }}
      - name: 推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./bolehunter-ats-web
          push: true
          tags: |
            ghcr.io/zhuangrenyang/bolehunter-frontend:latest
            ghcr.io/zhuangrenyang/bolehunter-frontend:${{ github.sha }}
